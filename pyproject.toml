[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-inventree-sync"
version = "0.1.1"
description = "Synchronize NetBox inventory data to InvenTree"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Eduardo Soares", email = "edurbs@gmail.com" }]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests",
]

[project.urls]
Homepage = "https://github.com/edurbs/netbox-inventree-sync"
Documentation = "https://github.com/edurbs/netbox-inventree-sync#readme"
Changelog = "https://github.com/edurbs/netbox-inventree-sync/releases"

[project.optional-dependencies]
dev = [
    "pytest",
    "responses",
]

[tool.setuptools.packages.find]
include = ["netbox_inventree_sync*"]

[tool.setuptools.package-data]
netbox_inventree_sync = ["templates/netbox_inventree_sync/*.html", "static/netbox_inventree_sync/js/*.js"]
