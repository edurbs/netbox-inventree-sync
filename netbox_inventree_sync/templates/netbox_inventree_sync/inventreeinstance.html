{% extends 'generic/object.html' %}
{% load render_table from django_tables2 %}

{% block content %}
  <div class="row mb-3">
    <div class="col col-12 col-md-6">
      <div class="card">
        <h5 class="card-header">Connection</h5>
        <table class="table table-hover attr-table">
          <tr>
            <th scope="row">Name</th>
            <td>{{ object.name }}</td>
          </tr>
          <tr>
            <th scope="row">URL</th>
            <td><a href="{{ object.url }}">{{ object.url }}</a></td>
          </tr>
          <tr>
            <th scope="row">Enabled</th>
            <td>{% checkmark object.enabled %}</td>
          </tr>
        </table>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col col-md-12">
      <div class="card">
        <h5 class="card-header">Mappings using this connection</h5>
        {% render_table mappings_table %}
      </div>
    </div>
  </div>
{% endblock content %}
